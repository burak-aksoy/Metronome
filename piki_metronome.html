<html lang="en">
<head>

    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Piki Metronome">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --primary-variant: #3700b3;
            --secondary-color: #03dac6;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent-color: #cf6679;
            --beat-active: #03dac6;
            --beat-accent: #bb86fc;
            --beat-inactive: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent; /* Remove grey flash on tap */
            touch-action: manipulation; /* Eliminate 300ms tap delay */
        }

        html {
            /* Prevent elastic bounce scroll revealing bg on Android */
            background-color: var(--bg-color);
            height: 100%;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            min-height: 100dvh; /* Dynamic viewport height - accounts for Android browser chrome */
            overflow-y: auto;
            overscroll-behavior: none; /* Prevent pull-to-refresh interfering */
        }

        .container {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            min-height: 100dvh;
            /* Respect notch / gesture bar safe areas */
            padding: calc(12px + env(safe-area-inset-top))
                     calc(16px + env(safe-area-inset-right))
                     calc(12px + env(safe-area-inset-bottom))
                     calc(16px + env(safe-area-inset-left));
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: var(--bg-color);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 12px;
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Visualizer */
        .visualizer-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            padding: 8px 0;
        }

        .beat-indicator {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: var(--surface-color);
            border: 4px solid var(--beat-inactive);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            color: var(--text-secondary);
            transition: all 0.1s ease-out;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            will-change: transform, background-color, box-shadow;
        }

        .beat-indicator.active {
            background-color: var(--beat-active);
            color: #000;
            transform: scale(1.05);
            border-color: var(--beat-active);
            box-shadow: 0 0 20px var(--beat-active);
        }

        .beat-indicator.accent {
            background-color: var(--beat-accent);
            color: #000;
            transform: scale(1.1);
            border-color: var(--beat-accent);
            box-shadow: 0 0 30px var(--beat-accent);
        }

        .sub-beats {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            height: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .sub-beat-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--beat-inactive);
            transition: background-color 0.05s;
        }

        .sub-beat-dot.active {
            background-color: var(--secondary-color);
            box-shadow: 0 0 8px var(--secondary-color);
        }

        /* Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: var(--surface-color);
            padding: 14px;
            border-radius: 16px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
        }

        .bpm-display {
            text-align: center;
            margin-bottom: 4px;
        }

        #bpm-val {
            font-size: 2.8rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .label {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            outline: none;
            cursor: pointer;
        }

        #bpm-slider {
            flex-grow: 1;
            height: 6px;
            background: #444;
            border-radius: 3px;
        }

        #bpm-slider::-webkit-slider-runnable-track {
            height: 6px;
            background: #444;
            border-radius: 3px;
        }

        #bpm-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(187, 134, 252, 0.5);
            /* Vertically center the thumb over the track on Android */
            margin-top: -11px;
        }

        #bpm-slider::-moz-range-track {
            height: 6px;
            background: #444;
            border-radius: 3px;
        }

        #bpm-slider::-moz-range-thumb {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary-color);
            border: none;
            box-shadow: 0 0 10px rgba(187, 134, 252, 0.5);
        }

        .adjust-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background-color: #333;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .adjust-btn:active {
            background-color: #555;
        }

        .secondary-btn {
            background-color: transparent;
            border: 2px solid var(--text-secondary);
            color: var(--text-secondary);
            padding: 12px 10px;
            border-radius: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            min-height: 44px;
        }

        .secondary-btn:active {
            background-color: rgba(255,255,255,0.1);
        }

        .tap-tempo-help {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: -6px;
            margin-bottom: 4px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .setting-item label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-left: 5px;
        }

        .stepper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #333;
            border-radius: 10px;
            padding: 5px;
        }

        .stepper-btn {
            width: 44px;
            height: 44px;
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #beats-val {
            font-size: 1.2rem;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            appearance: none;
            -webkit-appearance: none;
            text-align: center;
            min-height: 44px;
        }

        .primary-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            letter-spacing: 2px;
            color: #000;
            min-height: 52px;
        }

        .primary-btn.play {
            background-color: var(--secondary-color);
            box-shadow: 0 4px 15px rgba(3, 218, 198, 0.4);
        }

        .primary-btn.stop {
            background-color: var(--accent-color);
            color: white;
            box-shadow: 0 4px 15px rgba(207, 102, 121, 0.4);
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
            padding: 0 6px 8px;
        }

        .volume-control label {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        #volume {
            flex-grow: 1;
            height: 4px;
            background: #444;
            border-radius: 2px;
        }

        #volume::-webkit-slider-runnable-track {
            height: 4px;
            background: #444;
            border-radius: 2px;
        }

        #volume::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--text-secondary);
            cursor: pointer;
            margin-top: -9px;
        }

        #volume::-moz-range-track {
            height: 4px;
            background: #444;
            border-radius: 2px;
        }

        #volume::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--text-secondary);
            border: none;
        }

        @media (min-width: 600px) {
            .container {
                border-radius: 20px;
                min-height: 700px;
                padding: 20px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            }

            .beat-indicator {
                width: 150px;
                height: 150px;
                font-size: 4rem;
            }

            .controls {
                gap: 15px;
                padding: 20px;
            }

            #bpm-val {
                font-size: 3.5rem;
            }

            .primary-btn {
                padding: 15px;
                font-size: 1.2rem;
            }
        }

        @media (max-height: 600px) {
            .visualizer-container {
                flex-grow: 0;
                margin-bottom: 6px;
                padding: 4px 0;
            }

            .beat-indicator {
                width: 80px;
                height: 80px;
                font-size: 2rem;
            }

            .sub-beats {
                margin-top: 6px;
            }
        }

        /* Mode switch (Click / Drums) */
        .mode-switch {
            display: flex;
            gap: 4px;
            background-color: #333;
            border-radius: 12px;
            padding: 4px;
        }

        .mode-btn {
            flex: 1;
            background: none;
            border: none;
            border-radius: 9px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 10px;
            min-height: 44px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .mode-btn.active {
            background-color: var(--primary-color);
            color: #000;
        }

        body:not(.drum-mode) .drum-only,
        body.drum-mode .click-only {
            display: none !important;
        }

        .setting-item.wide {
            grid-column: 1 / -1;
        }

        .swing-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #333;
            border-radius: 10px;
            padding: 0 14px;
            min-height: 44px;
        }

        .swing-control.disabled {
            opacity: 0.4;
        }

        #swing-val {
            font-size: 0.85rem;
            font-weight: bold;
            min-width: 36px;
            text-align: right;
        }

        #swing {
            flex-grow: 1;
            height: 4px;
            background: #555;
            border-radius: 2px;
        }

        #swing::-webkit-slider-runnable-track {
            height: 4px;
            background: #555;
            border-radius: 2px;
        }

        #swing::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            margin-top: -9px;
        }

        #swing::-moz-range-track {
            height: 4px;
            background: #555;
            border-radius: 2px;
        }

        #swing::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--primary-color);
            border: none;
        }

        /* Drum step sequencer */
        .drum-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 14px;
        }

        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 28px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        .fill-badge {
            margin-left: 6px;
            padding: 2px 6px;
            border-radius: 6px;
            background-color: var(--accent-color);
            color: #fff;
            font-size: 0.65rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.1s;
        }

        .fill-badge.on {
            opacity: 1;
        }

        .text-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 6px 4px;
            cursor: pointer;
        }

        .drum-grid {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .grid-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .row-label {
            width: 40px;
            flex-shrink: 0;
            background: none;
            border: none;
            color: var(--c);
            font-size: 0.62rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-align: right;
            padding: 0;
            min-height: 24px;
            cursor: pointer;
        }

        .grid-row.muted .row-label {
            opacity: 0.35;
            text-decoration: line-through;
        }

        .row-steps {
            flex: 1;
            display: flex;
            gap: 5px;
            min-width: 0;
        }

        .beat-group {
            flex: 1;
            display: flex;
            gap: 2px;
            min-width: 0;
        }

        .step {
            flex: 1;
            min-width: 0;
            height: 24px;
            padding: 0;
            border: none;
            border-radius: 4px;
            background-color: #2a2a2a;
            cursor: pointer;
            transition: background-color 0.08s, transform 0.08s, box-shadow 0.08s;
        }

        .beat-group .step:first-child {
            background-color: #363636;
        }

        /* Empty cells under the playhead light up; filled cells keep their color */
        .step.playhead,
        .beat-group .step.playhead:first-child {
            background-color: #555;
        }

        .step.v-ghost,
        .step.v-on,
        .step.v-accent,
        .beat-group .step.v-ghost:first-child,
        .beat-group .step.v-on:first-child,
        .beat-group .step.v-accent:first-child {
            background-color: var(--c);
        }

        .step.v-ghost { opacity: 0.3; }
        .step.v-on { opacity: 0.65; }
        .step.v-accent { opacity: 1; }

        .grid-row.muted .step.v-ghost,
        .grid-row.muted .step.v-on,
        .grid-row.muted .step.v-accent {
            opacity: 0.15;
        }

        .step.hit {
            opacity: 1;
            transform: scaleY(1.2);
            box-shadow: 0 0 10px var(--c);
        }

        .grid-help {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        body.drum-mode .beat-indicator {
            width: 96px;
            height: 96px;
            font-size: 2.4rem;
        }

        @media (max-height: 600px) {
            body.drum-mode .beat-indicator {
                width: 64px;
                height: 64px;
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Piki Metronome</h1>
            <button id="wakeLockBtn" class="icon-btn" title="Toggle Screen Stay Awake">
                <span id="wakeLockStatus">🔓</span>
            </button>
        </header>

        <div class="visualizer-container">
            <div id="beat-visual" class="beat-indicator">
                <span id="beat-number">1</span>
            </div>
            <div class="sub-beats" id="sub-beats-container">
                <!-- Dots generated by JS -->
            </div>

            <div class="drum-panel drum-only">
                <div class="grid-header">
                    <span><span id="drum-bar">BAR 1</span><span id="fill-badge" class="fill-badge">FILL</span></span>
                    <button id="drum-reset" class="text-btn" hidden>↺ RESET</button>
                </div>
                <div id="drum-grid" class="drum-grid">
                    <!-- Rows generated by JS -->
                </div>
                <p class="grid-help">Tap a step to edit · tap a name to mute</p>
            </div>
        </div>

        <div class="controls">
            <div class="mode-switch">
                <button class="mode-btn active" data-mode="click">🎵 CLICK</button>
                <button class="mode-btn" data-mode="drums">🥁 DRUMS</button>
            </div>

            <div class="bpm-display">
                <span id="bpm-val">120</span> <span class="label">BPM</span>
            </div>

            <div class="slider-container">
                <button class="adjust-btn" id="bpm-decrease">-</button>
                <input type="range" id="bpm-slider" min="20" max="300" value="120">
                <button class="adjust-btn" id="bpm-increase">+</button>
            </div>

            <button id="tap-btn" class="secondary-btn">TAP TEMPO</button>
            <p class="tap-tempo-help">Tap 2+ times to set tempo</p>

            <div class="settings-grid">
                <div class="setting-item click-only">
                    <label for="beats-per-measure">Beats</label>
                    <div class="stepper">
                        <button id="beats-down" class="stepper-btn">-</button>
                        <span id="beats-val">4</span>
                        <button id="beats-up" class="stepper-btn">+</button>
                    </div>
                </div>
                <div class="setting-item click-only">
                    <label for="subdivision">Subdivision</label>
                    <select id="subdivision">
                        <option value="1">Quarter (1/4)</option>
                        <option value="2">Eighth (1/8)</option>
                        <option value="3">Triplet (1/8T)</option>
                        <option value="4">Sixteenth (1/16)</option>
                    </select>
                </div>
                <div class="setting-item click-only">
                    <label for="sound-type">Sound</label>
                    <select id="sound-type">
                        <option value="digital">Digital</option>
                        <option value="wood">Wood</option>
                        <option value="click">Click</option>
                        <option value="beep">Beep</option>
                    </select>
                </div>

                <div class="setting-item wide drum-only">
                    <label for="drum-style">Style</label>
                    <select id="drum-style">
                        <!-- Options generated by JS -->
                    </select>
                </div>
                <div class="setting-item drum-only">
                    <label for="drum-fill">Fill</label>
                    <select id="drum-fill">
                        <option value="0">Off</option>
                        <option value="2">Every 2 bars</option>
                        <option value="4">Every 4 bars</option>
                        <option value="8">Every 8 bars</option>
                    </select>
                </div>

        // Synthesizes every drum voice once into an AudioBuffer (offline),
        // so playback is just cheap buffer sources with sample-accurate timing.
        class DrumKit {
            constructor() {
                this.buffers = {};
                this.sampleRate = 44100;
                this.ready = this.renderAll().catch(err => console.error('Drum kit render failed', err));
            }

            async renderAll() {
                const voices = {
                    kick:    [0.5, (ctx, out) => this.kick(ctx, out)],
                    snare:   [0.3, (ctx, out) => this.snare(ctx, out)],
                    rim:     [0.1, (ctx, out) => this.rim(ctx, out)],
                    clap:    [0.3, (ctx, out) => this.clap(ctx, out)],
                    hihat:   [0.1, (ctx, out) => this.metallic(ctx, out, 40, 0.05, 10000, 7000)],
                    openhat: [0.5, (ctx, out) => this.metallic(ctx, out, 40, 0.4, 10000, 7000)],
                    ride:    [1.2, (ctx, out) => this.ride(ctx, out)],
                    crash:   [1.8, (ctx, out) => this.crash(ctx, out)],
                    shaker:  [0.1, (ctx, out) => this.shaker(ctx, out)],
                    tomH:    [0.5, (ctx, out) => this.tom(ctx, out, 220)],
                    tomM:    [0.5, (ctx, out) => this.tom(ctx, out, 165)],
                    tomL:    [0.6, (ctx, out) => this.tom(ctx, out, 110)],
                    dum:     [0.6, (ctx, out) => this.dum(ctx, out)],
                    tek:     [0.15, (ctx, out) => this.tek(ctx, out)],
                    tef:     [0.3, (ctx, out) => this.tef(ctx, out)]
                };
                await Promise.all(Object.entries(voices).map(async ([name, [duration, build]]) => {
                    this.buffers[name] = await this.render(duration, build);
                }));
            }

            render(duration, build) {
                const Offline = window.OfflineAudioContext || window.webkitOfflineAudioContext;
                const ctx = new Offline(1, Math.ceil(duration * this.sampleRate), this.sampleRate);
                build(ctx, ctx.destination);
                return new Promise(resolve => {
                    ctx.oncomplete = e => resolve(e.renderedBuffer);
                    const p = ctx.startRendering();
                    if (p && p.then) p.then(resolve);
                }).then(buffer => this.normalize(buffer));
            }

            // Scale every voice to the same peak so DRUM_VOICES levels define the mix
            normalize(buffer) {
                const data = buffer.getChannelData(0);
                let peak = 0;
                for (let i = 0; i < data.length; i++) peak = Math.max(peak, Math.abs(data[i]));
                if (peak > 0) {
                    for (let i = 0; i < data.length; i++) data[i] /= peak;
                }
                return buffer;
            }

            noise(ctx, duration) {
                const buffer = ctx.createBuffer(1, Math.ceil(duration * ctx.sampleRate), ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
                const src = ctx.createBufferSource();
                src.buffer = buffer;
                return src;
            }

            filter(ctx, type, freq, q = 1) {
                const f = ctx.createBiquadFilter();
                f.type = type;
                f.frequency.value = freq;
                f.Q.value = q;
                return f;
            }

            // Gain envelope: instant attack to `peak`, exponential decay to silence
            decayGain(ctx, peak, decay, start = 0) {
                const g = ctx.createGain();
                g.gain.setValueAtTime(0.0001, 0);
                g.gain.setValueAtTime(peak, start);
                g.gain.exponentialRampToValueAtTime(0.0001, start + decay);
                return g;
            }

            kick(ctx, out) {
                // Body: pitch-swept sine
                const osc = ctx.createOscillator();
                osc.frequency.setValueAtTime(160, 0);
                osc.frequency.exponentialRampToValueAtTime(55, 0.08);
                osc.frequency.exponentialRampToValueAtTime(40, 0.4);
                const body = this.decayGain(ctx, 1, 0.45);
                osc.connect(body).connect(out);
                osc.start(0);
                osc.stop(0.5);

                // Beater click
                const click = this.noise(ctx, 0.02);
                const lp = this.filter(ctx, 'lowpass', 3000);
                const clickGain = this.decayGain(ctx, 0.35, 0.015);
                click.connect(lp).connect(clickGain).connect(out);
                click.start(0);
            }

            snare(ctx, out) {
                // Snare wires
                const n = this.noise(ctx, 0.3);
                const hp = this.filter(ctx, 'highpass', 1200);
                const wires = this.decayGain(ctx, 0.8, 0.22);
                n.connect(hp).connect(wires).connect(out);
                n.start(0);

                // Drum head
                const osc = ctx.createOscillator();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(230, 0);
                osc.frequency.exponentialRampToValueAtTime(160, 0.08);
                const head = this.decayGain(ctx, 0.7, 0.12);
                osc.connect(head).connect(out);
                osc.start(0);
                osc.stop(0.3);
            }

            rim(ctx, out) {
                const osc = ctx.createOscillator();
                osc.type = 'triangle';
                osc.frequency.value = 1700;
                const tone = this.decayGain(ctx, 0.8, 0.04);
                osc.connect(tone).connect(out);
                osc.start(0);
                osc.stop(0.1);

                const n = this.noise(ctx, 0.05);
                const bp = this.filter(ctx, 'bandpass', 3500, 2);
                const crack = this.decayGain(ctx, 0.6, 0.02);
                n.connect(bp).connect(crack).connect(out);
                n.start(0);
            }

            clap(ctx, out) {
                const n = this.noise(ctx, 0.3);
                const bp = this.filter(ctx, 'bandpass', 1200, 1.2);
                const g = ctx.createGain();
                // Three quick hand slaps followed by the room tail
                g.gain.setValueAtTime(0.0001, 0);
                for (let i = 0; i < 3; i++) {
                    const t = i * 0.011;
                    g.gain.setValueAtTime(1, t);
                    g.gain.exponentialRampToValueAtTime(0.15, t + 0.009);
                }
                g.gain.setValueAtTime(0.9, 0.034);
                g.gain.exponentialRampToValueAtTime(0.0001, 0.26);
                n.connect(bp).connect(g).connect(out);
                n.start(0);
            }

            // 808-style cymbal: six detuned square waves filtered into a metallic hiss
            metallic(ctx, out, base, decay, bandFreq, highFreq) {
                const bp = this.filter(ctx, 'bandpass', bandFreq);
                const hp = this.filter(ctx, 'highpass', highFreq);
                const env = this.decayGain(ctx, 1, decay);
                bp.connect(hp).connect(env).connect(out);
                [2, 3, 4.16, 5.43, 6.79, 8.21].forEach(ratio => {
                    const osc = ctx.createOscillator();
                    osc.type = 'square';
                    osc.frequency.value = base * ratio;
                    osc.connect(bp);
                    osc.start(0);
                    osc.stop(decay + 0.05);
                });
            }

            ride(ctx, out) {
                this.metallic(ctx, out, 62, 1.1, 8000, 4500);
                // Bell ping
                const osc = ctx.createOscillator();
                osc.frequency.value = 2650;
                const bell = this.decayGain(ctx, 0.08, 0.6);
                osc.connect(bell).connect(out);
                osc.start(0);
                osc.stop(1.2);
            }

            crash(ctx, out) {
                this.metallic(ctx, out, 48, 1.6, 9000, 5000);
                const n = this.noise(ctx, 1.8);
                const hp = this.filter(ctx, 'highpass', 4000);
                const wash = this.decayGain(ctx, 0.6, 1.7);
                n.connect(hp).connect(wash).connect(out);
                n.start(0);
            }

            shaker(ctx, out) {
                const n = this.noise(ctx, 0.1);
                const bp = this.filter(ctx, 'bandpass', 6500, 1.5);
                const g = ctx.createGain();
                g.gain.setValueAtTime(0.0001, 0);
                g.gain.exponentialRampToValueAtTime(1, 0.015);
                g.gain.exponentialRampToValueAtTime(0.0001, 0.08);
                n.connect(bp).connect(g).connect(out);
                n.start(0);
            }

            tom(ctx, out, freq) {
                const osc = ctx.createOscillator();
                osc.frequency.setValueAtTime(freq, 0);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.6, 0.35);
                const body = this.decayGain(ctx, 1, 0.45);
                osc.connect(body).connect(out);
                osc.start(0);
                osc.stop(0.6);

                const n = this.noise(ctx, 0.05);
                const lp = this.filter(ctx, 'lowpass', 2000);
                const stick = this.decayGain(ctx, 0.25, 0.04);
                n.connect(lp).connect(stick).connect(out);
                n.start(0);
            }

            // Darbuka "düm": open stroke in the middle of the head, deep and resonant
            dum(ctx, out) {
                const osc = ctx.createOscillator();
                osc.frequency.setValueAtTime(125, 0);
                osc.frequency.exponentialRampToValueAtTime(88, 0.1);
                const body = this.decayGain(ctx, 1, 0.55);
                osc.connect(body).connect(out);
                osc.start(0);
                osc.stop(0.6);

                const overtone = ctx.createOscillator();
                overtone.type = 'triangle';
                overtone.frequency.value = 210;
                const ring = this.decayGain(ctx, 0.15, 0.25);
                overtone.connect(ring).connect(out);
                overtone.start(0);
                overtone.stop(0.3);

                const n = this.noise(ctx, 0.04);
                const lp = this.filter(ctx, 'lowpass', 900);
                const slap = this.decayGain(ctx, 0.25, 0.03);
                n.connect(lp).connect(slap).connect(out);
                n.start(0);
            }

            // Darbuka "tek": sharp stroke on the rim
            tek(ctx, out) {
                const n = this.noise(ctx, 0.1);
                const bp = this.filter(ctx, 'bandpass', 3200, 1.5);
                const crack = this.decayGain(ctx, 1, 0.05);
                n.connect(bp).connect(crack).connect(out);
                n.start(0);

                const osc = ctx.createOscillator();
                osc.frequency.value = 1150;
                const ping = this.decayGain(ctx, 0.35, 0.07);
                osc.connect(ping).connect(out);
                osc.start(0);
                osc.stop(0.12);
            }

            // Tef (frame drum with jingles)
            tef(ctx, out) {
                this.metallic(ctx, out, 70, 0.18, 9000, 6000);
                const n = this.noise(ctx, 0.3);
                const bp = this.filter(ctx, 'bandpass', 7500, 2);
                const g = ctx.createGain();
                g.gain.setValueAtTime(0.0001, 0);
                g.gain.exponentialRampToValueAtTime(0.8, 0.004);
                g.gain.exponentialRampToValueAtTime(0.0001, 0.22);
                n.connect(bp).connect(g).connect(out);
                n.start(0);
            }
        }

        class Metronome {
            constructor() {
                this.audioContext = null;
                this.isPlaying = false;
                this.current16thNote = 0; // What tick (subdivision or drum step) are we currently scheduling?
                this.tempo = 120;
                this.lookahead = 25.0; // How frequently to call scheduling function (in milliseconds)
                this.scheduleAheadTime = 0.1; // How far ahead to schedule audio (sec)
                this.nextNoteTime = 0.0; // when the next note is due.
                this.timerID = null;

                // Settings
                this.beatsPerMeasure = 4;
                this.subdivision = 1; // 1=Quarter, 2=Eighth, 3=Triplet, 4=16th
                this.volume = 0.8;
                this.soundType = 'digital';

                // Drum mode
                this.mode = 'click'; // 'click' or 'drums'
                this.drumStyle = DRUM_STYLES[0].id;
                this.swing = 0; // 0..1
                this.fillEvery = 0; // bars, 0 = off
                this.clickLayer = false;
                this.customPatterns = {}; // { styleId: { voice: steps } } user edits
                this.mutedVoices = [];
                this.barCount = 0;
                this.openHat = null; // { gain, time } of the ringing open hi-hat, for choking
                this.drumBus = null;
                this.kit = new DrumKit();
                this.gridColumns = []; // step index -> cells in that column
                this.playheadStep = -1;

                // Visuals
                this.notesInQueue = []; // { note, time, drums, beat, beatStart, bar, fill }

                // Tap Tempo
                this.tapTimes = [];
                this.tapTimeout = null;

                // DOM Elements
                this.playBtn = document.getElementById('start-stop-btn');
                this.bpmSlider = document.getElementById('bpm-slider');
                this.bpmVal = document.getElementById('bpm-val');
                this.bpmDecrease = document.getElementById('bpm-decrease');
                this.bpmIncrease = document.getElementById('bpm-increase');
                this.tapBtn = document.getElementById('tap-btn');
                this.beatsVal = document.getElementById('beats-val');
                this.beatsDown = document.getElementById('beats-down');
                this.beatsUp = document.getElementById('beats-up');
                this.subdivisionSelect = document.getElementById('subdivision');
                this.soundSelect = document.getElementById('sound-type');
                this.volumeSlider = document.getElementById('volume');
                this.beatVisual = document.getElementById('beat-visual');
                this.beatNumberDisplay = document.getElementById('beat-number');
                this.subBeatsContainer = document.getElementById('sub-beats-container');
                this.wakeLockBtn = document.getElementById('wakeLockBtn');
                this.wakeLockStatus = document.getElementById('wakeLockStatus');
                this.modeButtons = document.querySelectorAll('.mode-btn');
                this.styleSelect = document.getElementById('drum-style');
                this.fillSelect = document.getElementById('drum-fill');
                this.clickLayerSelect = document.getElementById('click-layer');
                this.swingSlider = document.getElementById('swing');
                this.swingVal = document.getElementById('swing-val');
                this.swingControl = document.getElementById('swing-control');
                this.drumGrid = document.getElementById('drum-grid');
                this.drumBar = document.getElementById('drum-bar');
                this.fillBadge = document.getElementById('fill-badge');
                this.drumReset = document.getElementById('drum-reset');

                // Wake Lock
                this.wakeLock = null;

                this.init();
            }

            init() {
                DRUM_STYLES.forEach(style => {
                    const option = document.createElement('option');
                    option.value = style.id;
                    option.innerText = `${style.name} · ${style.meter}`;
                    this.styleSelect.appendChild(option);
                });

                this.loadSettings();
                this.setMode(this.mode);

                // Event Listeners
                this.playBtn.addEventListener('click', () => this.togglePlay());

                this.bpmSlider.addEventListener('input', (e) => {
                    this.changeTempo(e.target.value);
                    this.saveSettings();
                });
                this.bpmDecrease.addEventListener('click', () => {
                    this.changeTempo(this.tempo - 1);
                    this.saveSettings();
                });
                this.bpmIncrease.addEventListener('click', () => {
                    this.changeTempo(this.tempo + 1);
                    this.saveSettings();
                });

                this.tapBtn.addEventListener('click', () => {
                    this.tapTempo();
                    this.saveSettings();
                });

                this.beatsDown.addEventListener('click', () => {
                    this.changeBeats(this.beatsPerMeasure - 1);
                    this.saveSettings();
                });
                this.beatsUp.addEventListener('click', () => {
                    this.changeBeats(this.beatsPerMeasure + 1);
                    this.saveSettings();
                });

                this.subdivisionSelect.addEventListener('change', (e) => {
                    this.subdivision = parseInt(e.target.value);
                    this.updateSubBeatsUI();
                    this.saveSettings();
                });

                this.soundSelect.addEventListener('change', (e) => {
                    this.soundType = e.target.value;
                    this.saveSettings();
                });

                this.volumeSlider.addEventListener('input', (e) => {
                    this.volume = e.target.value / 100;
                    if (this.drumBus) this.drumBus.gain.value = this.volume;
                    this.saveSettings();
                });

                this.modeButtons.forEach(btn => btn.addEventListener('click', () => {
                    this.setMode(btn.dataset.mode);
                    this.saveSettings();
                }));

                this.styleSelect.addEventListener('change', (e) => {
                    this.changeStyle(e.target.value);
                    this.saveSettings();
                });

                this.fillSelect.addEventListener('change', (e) => {
                    this.fillEvery = parseInt(e.target.value);
                    this.saveSettings();
                });

                this.clickLayerSelect.addEventListener('change', (e) => {
                    this.clickLayer = e.target.value === 'on';
                    this.saveSettings();
                });

                this.swingSlider.addEventListener('input', (e) => {
                    this.swing = e.target.value / 100;
                    this.updateSwingUI();
                    this.saveSettings();
                });

                this.drumReset.addEventListener('click', () => {
                    delete this.customPatterns[this.drumStyle];
                    this.buildDrumGrid();
                    this.saveSettings();
                });

                this.wakeLockBtn.addEventListener('click', () => this.toggleWakeLock());

                // Handle page visibility change for wake lock
                document.addEventListener('visibilitychange', () => {
                    if (this.wakeLock !== null && document.visibilityState === 'visible') {
                        this.requestWakeLock();
                    }
                });

                requestAnimationFrame(this.draw.bind(this));
            }

            saveSettings() {
                const settings = {
                    tempo: this.tempo,
                    beatsPerMeasure: this.beatsPerMeasure,
                    subdivision: this.subdivision,
                    soundType: this.soundType,
                    volume: this.volume,
                    mode: this.mode,
                    drumStyle: this.drumStyle,
                    swing: this.swing,
                    fillEvery: this.fillEvery,
                    clickLayer: this.clickLayer,
                    customPatterns: this.customPatterns,
                    mutedVoices: this.mutedVoices
                };
                localStorage.setItem('metronomeSettings', JSON.stringify(settings));
            }

            loadSettings() {
                const savedSettings = localStorage.getItem('metronomeSettings');
                if (savedSettings) {
                    const settings = JSON.parse(savedSettings);

                    // Apply settings
                    if (settings.tempo) this.tempo = settings.tempo;
                    if (settings.beatsPerMeasure) this.beatsPerMeasure = settings.beatsPerMeasure;
                    if (settings.subdivision) this.subdivision = settings.subdivision;
                    if (settings.soundType) this.soundType = settings.soundType;
                    if (settings.volume !== undefined) this.volume = settings.volume;
                    if (settings.mode === 'drums') this.mode = 'drums';
                    if (DRUM_STYLES.some(s => s.id === settings.drumStyle)) this.drumStyle = settings.drumStyle;
                    if (settings.swing !== undefined) this.swing = settings.swing;
                    if (settings.fillEvery !== undefined) this.fillEvery = settings.fillEvery;
                    if (settings.clickLayer !== undefined) this.clickLayer = settings.clickLayer;
                    if (settings.customPatterns) this.customPatterns = settings.customPatterns;
                    if (Array.isArray(settings.mutedVoices)) this.mutedVoices = settings.mutedVoices;
                }

                // Update UI
                this.bpmSlider.value = this.tempo;
                this.bpmVal.innerText = this.tempo;
                this.beatsVal.innerText = this.beatsPerMeasure;
                this.subdivisionSelect.value = this.subdivision;
                this.soundSelect.value = this.soundType;
                this.volumeSlider.value = this.volume * 100;
                this.styleSelect.value = this.drumStyle;
                this.fillSelect.value = this.fillEvery;
                this.clickLayerSelect.value = this.clickLayer ? 'on' : 'off';
                this.updateSwingUI();
            }

            changeTempo(val) {
                let newTempo = parseInt(val);
                if (newTempo < 20) newTempo = 20;
                if (newTempo > 300) newTempo = 300;

                this.tempo = newTempo;
                this.bpmSlider.value = newTempo;
                this.bpmVal.innerText = newTempo;
            }

            changeBeats(val) {
                if (val < 1) val = 1;
                if (val > 16) val = 16;
                this.beatsPerMeasure = val;
                this.beatsVal.innerText = val;
                this.updateSubBeatsUI();
            }

            setMode(mode) {
                this.mode = mode;
                document.body.classList.toggle('drum-mode', mode === 'drums');
                this.modeButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
                // Restart the measure so the new mode starts on beat 1
                this.current16thNote = 0;
                this.barCount = 0;
                if (mode === 'drums') this.buildDrumGrid();
                this.updateSubBeatsUI();
            }

            changeStyle(id) {
                const oldPattern = this.getPattern();
                this.drumStyle = id;
                const pattern = this.getPattern();
                this.swing = pattern.swing;
                this.updateSwingUI();
                // Keep the groove position if the meter is the same, otherwise restart the bar
                if (pattern.groups.join() !== oldPattern.groups.join()) {
                    this.current16thNote = 0;
                }
                this.buildDrumGrid();
                this.updateSubBeatsUI();
            }

            // The style's preset merged with the user's edits
            getPattern() {
                const style = DRUM_STYLES.find(s => s.id === this.drumStyle) || DRUM_STYLES[0];
                const groups = style.groups || Array(style.beats).fill(style.spb);
                const steps = groups.reduce((sum, len) => sum + len, 0);
                // beatOf[step] = index of the beat the step belongs to
                const beatOf = groups.flatMap((len, beat) => Array(len).fill(beat));
                const voices = {};
                const custom = this.customPatterns[style.id] || {};
                Object.keys(DRUM_VOICES).forEach(voice => {
                    const s = custom[voice] || style.voices[voice];
                    if (s && s.length === steps) voices[voice] = s;
                });
                return { ...style, beats: groups.length, groups, steps, beatOf, voices };
            }

            getBeats() {
                return this.mode === 'drums' ? this.getPattern().beats : this.beatsPerMeasure;
            }

            isSwingable(pattern) {
                // Swing only makes sense on straight (even) grids with even beats
                return pattern.groups.every(len => len % 2 === 0);
            }

            updateSwingUI() {
                const swingable = this.isSwingable(this.getPattern());
                this.swingSlider.value = Math.round(this.swing * 100);
                this.swingSlider.disabled = !swingable;
                this.swingControl.classList.toggle('disabled', !swingable);
                this.swingVal.innerText = swingable ? `${Math.round(this.swing * 100)}%` : '—';
            }

            buildDrumGrid() {
                const pattern = this.getPattern();
                this.drumGrid.innerHTML = '';
                this.gridColumns = Array.from({ length: pattern.steps }, () => []);
                this.playheadStep = -1;

                const rows = Object.keys(DRUM_VOICES).filter(v => BASE_ROWS.includes(v) || pattern.voices[v]);
                rows.forEach(voice => {
                    const steps = pattern.voices[voice] || '.'.repeat(pattern.steps);
                    const row = document.createElement('div');
                    row.className = 'grid-row';
                    row.classList.toggle('muted', this.mutedVoices.includes(voice));
                    row.style.setProperty('--c', DRUM_VOICES[voice].color);

                    const label = document.createElement('button');
                    label.className = 'row-label';
                    label.innerText = DRUM_VOICES[voice].label;
                    label.addEventListener('click', () => this.toggleMute(voice, row));
                    row.appendChild(label);

                    const stepsEl = document.createElement('div');
                    stepsEl.className = 'row-steps';
                    let i = 0;
                    pattern.groups.forEach(len => {
                        const group = document.createElement('div');
                        group.className = 'beat-group';
                        // Longer (aksak) beats get proportionally more room
                        group.style.flexGrow = len;
                        for (let s = 0; s < len; s++, i++) {
                            const step = i;
                            const cell = document.createElement('button');
                            cell.className = 'step';
                            this.setCellValue(cell, steps[step]);
                            cell.addEventListener('click', () => this.toggleStep(voice, step, cell));
                            group.appendChild(cell);
                            this.gridColumns[step].push({ cell, voice });
                        }
                        stepsEl.appendChild(group);
                    });
                    row.appendChild(stepsEl);
                    this.drumGrid.appendChild(row);
                });

                this.drumReset.hidden = !this.customPatterns[this.drumStyle];
            }

            setCellValue(cell, value) {
                cell.dataset.v = value;
                cell.classList.remove('v-accent', 'v-on', 'v-ghost');
                if (STEP_CLASS[value]) cell.classList.add(STEP_CLASS[value]);
            }

            toggleStep(voice, i, cell) {
                const pattern = this.getPattern();
                const steps = pattern.voices[voice] || '.'.repeat(pattern.steps);
                const next = NEXT_STEP[steps[i]] || '.';
                const custom = this.customPatterns[this.drumStyle] || (this.customPatterns[this.drumStyle] = {});
                custom[voice] = steps.slice(0, i) + next + steps.slice(i + 1);
                this.setCellValue(cell, next);
                this.drumReset.hidden = false;
                this.saveSettings();
            }

            toggleMute(voice, row) {
                if (this.mutedVoices.includes(voice)) {
                    this.mutedVoices = this.mutedVoices.filter(v => v !== voice);
                } else {
                    this.mutedVoices.push(voice);
                }
                row.classList.toggle('muted', this.mutedVoices.includes(voice));
                this.saveSettings();
            }

            updateSubBeatsUI() {
                // One dot per beat in the measure
                this.subBeatsContainer.innerHTML = '';
                const beats = this.getBeats();
                for (let i = 0; i < beats; i++) {
                    const dot = document.createElement('div');
                    dot.className = 'sub-beat-dot';
                    dot.id = `beat-dot-${i}`;
                    this.subBeatsContainer.appendChild(dot);
                }
            }

            togglePlay() {
                this.isPlaying = !this.isPlaying;

                if (this.isPlaying) {
                    // Start
                    if (!this.audioContext) {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        this.createDrumBus();
                    } else {
                        this.audioContext.resume();
                    }

                    this.current16thNote = 0;
                    this.barCount = 0;
                    this.openHat = null;
                    this.nextNoteTime = this.audioContext.currentTime + 0.1;
                    this.timerID = setInterval(() => this.scheduler(), this.lookahead);

                    this.playBtn.innerText = 'STOP';
                    this.playBtn.classList.remove('play');
                    this.playBtn.classList.add('stop');
                    this.requestWakeLock();
                } else {
                    // Stop
                    clearInterval(this.timerID);
                    this.notesInQueue = [];
                    this.playBtn.innerText = 'START';
                    this.playBtn.classList.remove('stop');
                    this.playBtn.classList.add('play');
                    this.beatVisual.classList.remove('active', 'accent');
                    // Reset dots and sequencer
                    document.querySelectorAll('.sub-beat-dot').forEach(dot => dot.classList.remove('active'));
                    this.movePlayhead(-1, false);
                    this.fillBadge.classList.remove('on');
                    if (this.wakeLock) {
                        this.wakeLock.release().then(() => {
                          this.wakeLock = null;
                          this.updateWakeLockUI(false);
                        });
                    }
                }
            }

            // Drums go through a shared bus with light compression for punch
            createDrumBus() {
                const compressor = this.audioContext.createDynamicsCompressor();
                compressor.threshold.value = -14;
                compressor.knee.value = 10;
                compressor.ratio.value = 4;
                compressor.attack.value = 0.003;
                compressor.release.value = 0.15;
                compressor.connect(this.audioContext.destination);

                this.drumBus = this.audioContext.createGain();
                this.drumBus.gain.value = this.volume;
                this.drumBus.connect(compressor);
            }

            scheduler() {
                // while there are notes that will need to play before the next interval,
                // schedule them and advance the pointer.
                while (this.nextNoteTime < this.audioContext.currentTime + this.scheduleAheadTime) {
                    if (this.mode === 'drums') {
                        this.scheduleDrumStep(this.current16thNote, this.nextNoteTime);
                    } else {
                        this.scheduleNote(this.current16thNote, this.nextNoteTime);
                    }
                    this.nextNote();
                }
            }

            nextNote() {
                // Advance current tick and time by one subdivision (or drum step)
                const secondsPerBeat = 60.0 / this.tempo;
                let ticksPerBeat = this.subdivision;
                let totalTicks = this.beatsPerMeasure * this.subdivision;
                if (this.mode === 'drums') {
                    const pattern = this.getPattern();
                    ticksPerBeat = pattern.spb;
                    totalTicks = pattern.steps;
                }

                this.nextNoteTime += secondsPerBeat / ticksPerBeat;

                this.current16thNote++;

                if (this.current16thNote >= totalTicks) {
                    this.current16thNote = 0;
                    this.barCount++;
                }
            }

            scheduleNote(beatNumber, time) {
                const ticksPerBeat = this.subdivision;

                const isMeasureStart = (beatNumber === 0);
                const isBeatStart = (beatNumber % ticksPerBeat === 0);

                // Push the note to the queue for visual processing
                this.notesInQueue.push({
                    note: beatNumber, time: time, drums: false,
                    beat: Math.floor(beatNumber / ticksPerBeat), beatStart: isBeatStart
                });

                if (isMeasureStart) {
                    this.playClick('measure', time);
                } else if (isBeatStart) {
                    this.playClick('beat', time);
                } else {
                    this.playClick('sub', time);
                }
            }

            playClick(level, time, gain = 1) {
                // Create an oscillator
                const osc = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();

                osc.connect(gainNode);
                gainNode.connect(this.audioContext.destination);

                let freqHigh, freqMed, freqLow;
                let type = 'sine';
                let decay = 0.05;

                switch(this.soundType) {
                    case 'click':
                        type = 'square';
                        freqHigh = 1500; freqMed = 1000; freqLow = 600;
                        decay = 0.03;
                        break;
                    case 'wood':
                        type = 'triangle';
                        freqHigh = 1200; freqMed = 900; freqLow = 600;
                        decay = 0.1;
                        break;
                    case 'beep':
                        type = 'sawtooth';
                        freqHigh = 1000; freqMed = 600; freqLow = 300;
                        decay = 0.05;
                        break;
                    case 'digital':
                    default:
                        type = 'sine';
                        freqHigh = 880; freqMed = 440; freqLow = 220;
                        decay = 0.05;
                        break;
                }

                osc.type = type;

                if (level === 'measure') {
                    osc.frequency.value = freqHigh;
                    gainNode.gain.value = 1.0 * this.volume * gain;
                } else if (level === 'beat') {
                    osc.frequency.value = freqMed;
                    gainNode.gain.value = 0.6 * this.volume * gain;
                } else {
                    // Subdivision
                    osc.frequency.value = freqLow;
                    gainNode.gain.value = 0.3 * this.volume * gain;
                }

                osc.start(time);

                // Use exponential ramp for better click/percussion sound
                gainNode.gain.setValueAtTime(gainNode.gain.value, time);
                gainNode.gain.exponentialRampToValueAtTime(0.001, time + decay);

                osc.stop(time + decay);
            }

            scheduleDrumStep(step, time) {
                const pattern = this.getPattern();
                const spb = pattern.spb;
                const beat = pattern.beatOf[step];
                const isBeatStart = step === 0 || pattern.beatOf[step - 1] !== beat;

                // Swing delays every off-step by up to half a step
                if (this.isSwingable(pattern) && step % 2 === 1) {
                    time += this.swing * 0.5 * (60.0 / this.tempo / spb);
                }

                // The last beats of every Nth bar are replaced by a fill
                const isFillBar = this.fillEvery > 0 && this.barCount % this.fillEvery === this.fillEvery - 1;
                const fillBeats = pattern.beats >= 4 ? 2 : 1;
                const fillSteps = pattern.groups.slice(-fillBeats).reduce((sum, len) => sum + len, 0);
                const fillStart = pattern.steps - fillSteps;
                const inFill = isFillBar && step >= fillStart;

                if (inFill) {
                    const fillVoices = pattern.fill || FILL_VOICES;
                    const i = step - fillStart;
                    const voice = fillVoices[Math.floor(i * fillVoices.length / fillSteps)];
                    this.playDrum(voice, isBeatStart ? 'X' : 'x', time);
                } else {
                    Object.entries(pattern.voices).forEach(([voice, steps]) => {
                        const v = steps[step];
                        if (VELOCITY[v] && !this.mutedVoices.includes(voice)) this.playDrum(voice, v, time);
                    });
                }

                // Land the fill with a crash on the next downbeat
                if (step === 0 && this.fillEvery > 0 && this.barCount > 0 && this.barCount % this.fillEvery === 0) {
                    this.playDrum('crash', 'X', time);
                }

                if (this.clickLayer && isBeatStart) {
                    this.playClick(step === 0 ? 'measure' : 'beat', time, 0.7);
                }

                this.notesInQueue.push({
                    note: step, time, drums: true, beat, beatStart: isBeatStart,
                    bar: this.barCount, fill: inFill
                });
            }

            playDrum(voice, velocity, time) {
                const buffer = this.kit.buffers[voice];
                if (!buffer) return;

                const src = this.audioContext.createBufferSource();
                src.buffer = buffer;
                const gainNode = this.audioContext.createGain();
                // A touch of random velocity so the groove doesn't sound robotic
                const humanize = 1 + (Math.random() - 0.5) * 0.1;
                gainNode.gain.value = DRUM_VOICES[voice].level * VELOCITY[velocity] * humanize;
                src.connect(gainNode);
                gainNode.connect(this.drumBus);

                // A closed hi-hat chokes a ringing open hi-hat
                if (voice === 'hihat' && this.openHat && this.openHat.time < time) {
                    this.openHat.gain.gain.setTargetAtTime(0, time, 0.01);
                    this.openHat = null;
                }
                if (voice === 'openhat') this.openHat = { gain: gainNode, time };

                src.start(time);
            }

            movePlayhead(step, fill) {
                if (this.playheadStep >= 0 && this.gridColumns[this.playheadStep]) {
                    this.gridColumns[this.playheadStep].forEach(({ cell }) => cell.classList.remove('playhead', 'hit'));
                }
                this.playheadStep = step;
                if (step < 0 || !this.gridColumns[step]) return;
                this.gridColumns[step].forEach(({ cell, voice }) => {
                    cell.classList.add('playhead');
                    if (!fill && VELOCITY[cell.dataset.v] && !this.mutedVoices.includes(voice)) {
                        cell.classList.add('hit');
                    }
                });
            }

            draw() {
                let current = null;
                const currentTime = this.audioContext ? this.audioContext.currentTime : 0;

                while (this.notesInQueue.length && this.notesInQueue[0].time < currentTime) {
                    current = this.notesInQueue.shift(); // remove note from queue
                }

                // Only redraw when a new tick has started
                if (current) {
                    const currentNote = current.note;
                    const isMeasureStart = (currentNote === 0);
                    const isBeatStart = current.beatStart;
                    const currentBeatIndex = current.beat;

                    // Reset visual state
                    this.beatVisual.classList.remove('accent', 'active');

                    if (isMeasureStart) {
                        this.beatVisual.classList.add('accent');
                    } else if (isBeatStart) {
                        this.beatVisual.classList.add('active');
                    }

                    // Update Number
                    if (isBeatStart) {
                        this.beatNumberDisplay.innerText = currentBeatIndex + 1;

                        // Update dots
                        document.querySelectorAll('.sub-beat-dot').forEach((dot, index) => {
                            if (index === currentBeatIndex) {
                                dot.classList.add('active');
                            } else {
                                dot.classList.remove('active');
                            }
                        });
                    }

                    if (current.drums) {
                        this.movePlayhead(currentNote, current.fill);
                        this.drumBar.innerText = `BAR ${current.bar + 1}`;
                        this.fillBadge.classList.toggle('on', current.fill);
                    }
                }

                requestAnimationFrame(this.draw.bind(this));
            }

            tapTempo() {
                const now = Date.now();

                // Reset if too long between taps (e.g., 2 seconds)
                if (this.tapTimes.length > 0 && now - this.tapTimes[this.tapTimes.length - 1] > 2000) {
                    this.tapTimes = [];
                }

                this.tapTimes.push(now);

                // Keep last 4 taps
                if (this.tapTimes.length > 4) {
                    this.tapTimes.shift();
                }

                if (this.tapTimes.length > 1) {
                    // Calculate average interval
                    let totalInterval = 0;
                    for (let i = 1; i < this.tapTimes.length; i++) {
                        totalInterval += (this.tapTimes[i] - this.tapTimes[i - 1]);
                    }
                    const avgInterval = totalInterval / (this.tapTimes.length - 1);
                    const bpm = Math.round(60000 / avgInterval);

                    this.changeTempo(bpm);
                }
            }

            // Wake Lock API
            async requestWakeLock() {
                try {
                    if ('wakeLock' in navigator) {
                        this.wakeLock = await navigator.wakeLock.request('screen');
                        this.updateWakeLockUI(true);

                        this.wakeLock.addEventListener('release', () => {
                           // console.log('Screen Wake Lock released');
                           // Only update UI if we didn't release it manually (e.g. system released it)
                           if (!this.isPlaying) {
                               this.updateWakeLockUI(false);
                           }
                        });
                    } else {
                        console.warn('Wake Lock API not supported');
                        this.wakeLockBtn.style.display = 'none';
                    }
                } catch (err) {
                    console.error(`${err.name}, ${err.message}`);
                    this.updateWakeLockUI(false);
                }
            }

            async toggleWakeLock() {
                if (this.wakeLock) {
                    await this.wakeLock.release();
                    this.wakeLock = null;
                    this.updateWakeLockUI(false);
                } else {
                    this.requestWakeLock();
                }
            }

            updateWakeLockUI(isActive) {
                if (isActive) {
                    this.wakeLockStatus.innerText = '🔒'; // Locked (stay awake)
                    this.wakeLockBtn.classList.add('active');
                    this.wakeLockBtn.style.color = 'var(--secondary-color)';
                } else {
                    this.wakeLockStatus.innerText = '🔓'; // Unlocked (normal behavior)
                    this.wakeLockBtn.classList.remove('active');
                    this.wakeLockBtn.style.color = 'var(--text-secondary)';
                }
            }
        }

        // Start the app
        window.addEventListener('DOMContentLoaded', () => {
            const metronome = new Metronome();

            // Register service worker for PWA / offline support
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            }
        });
    </script>
</body>
</html>
