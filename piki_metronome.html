    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Piki Metronome">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --primary-variant: #3700b3;
            --secondary-color: #03dac6;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent-color: #cf6679;
            --beat-active: #03dac6;
            --beat-accent: #bb86fc;
            --beat-inactive: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent; /* Remove grey flash on tap */
            touch-action: manipulation; /* Eliminate 300ms tap delay */
        }

        html {
            /* Prevent elastic bounce scroll revealing bg on Android */
            background-color: var(--bg-color);
            height: 100%;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            min-height: 100dvh; /* Dynamic viewport height - accounts for Android browser chrome */
            overflow-y: auto;
            overscroll-behavior: none; /* Prevent pull-to-refresh interfering */
        }

        .container {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            min-height: 100dvh;
            /* Respect notch / gesture bar safe areas */
            padding: calc(12px + env(safe-area-inset-top))
                     calc(16px + env(safe-area-inset-right))
                     calc(12px + env(safe-area-inset-bottom))
                     calc(16px + env(safe-area-inset-left));
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: var(--bg-color);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 12px;
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Visualizer */
        .visualizer-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            padding: 8px 0;
        }

        .beat-indicator {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: var(--surface-color);
            border: 4px solid var(--beat-inactive);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            color: var(--text-secondary);
            transition: all 0.1s ease-out;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            will-change: transform, background-color, box-shadow;
        }

        .beat-indicator.active {
            background-color: var(--beat-active);
            color: #000;
            transform: scale(1.05);
            border-color: var(--beat-active);
            box-shadow: 0 0 20px var(--beat-active);
        }

        .beat-indicator.accent {
            background-color: var(--beat-accent);
            color: #000;
            transform: scale(1.1);
            border-color: var(--beat-accent);
            box-shadow: 0 0 30px var(--beat-accent);
        }

        .sub-beats {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            height: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .sub-beat-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--beat-inactive);
            transition: background-color 0.05s;
        }

        .sub-beat-dot.active {
            background-color: var(--secondary-color);
            box-shadow: 0 0 8px var(--secondary-color);
        }

        /* Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: var(--surface-color);
            padding: 14px;
            border-radius: 16px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
        }

        .bpm-display {
            text-align: center;
            margin-bottom: 4px;
        }

        #bpm-val {
            font-size: 2.8rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .label {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            outline: none;
            cursor: pointer;
        }

        #bpm-slider {
            flex-grow: 1;
            height: 6px;
            background: #444;
            border-radius: 3px;
        }

        #bpm-slider::-webkit-slider-runnable-track {
            height: 6px;
            background: #444;
            border-radius: 3px;
        }

        #bpm-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(187, 134, 252, 0.5);
            /* Vertically center the thumb over the track on Android */
            margin-top: -11px;
        }

        #bpm-slider::-moz-range-track {
            height: 6px;
            background: #444;
            border-radius: 3px;
        }

        #bpm-slider::-moz-range-thumb {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary-color);
            border: none;
            box-shadow: 0 0 10px rgba(187, 134, 252, 0.5);
        }

        .adjust-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background-color: #333;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .adjust-btn:active {
            background-color: #555;
        }

        .secondary-btn {
            background-color: transparent;
            border: 2px solid var(--text-secondary);
            color: var(--text-secondary);
            padding: 12px 10px;
            border-radius: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            min-height: 44px;
        }

        .secondary-btn:active {
            background-color: rgba(255,255,255,0.1);
        }

        .tap-tempo-help {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: -6px;
            margin-bottom: 4px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .setting-item label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-left: 5px;
        }

        .stepper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #333;
            border-radius: 10px;
            padding: 5px;
        }

        .stepper-btn {
            width: 44px;
            height: 44px;
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #beats-val {
            font-size: 1.2rem;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            appearance: none;
            -webkit-appearance: none;
            text-align: center;
            min-height: 44px;
        }

        .primary-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            letter-spacing: 2px;
            color: #000;
            min-height: 52px;
        }

        .primary-btn.play {
            background-color: var(--secondary-color);
            box-shadow: 0 4px 15px rgba(3, 218, 198, 0.4);
        }

        .primary-btn.stop {
            background-color: var(--accent-color);
            color: white;
            box-shadow: 0 4px 15px rgba(207, 102, 121, 0.4);
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
            padding: 0 6px 8px;
        }

        .volume-control label {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        #volume {
            flex-grow: 1;
            height: 4px;
            background: #444;
            border-radius: 2px;
        }

        #volume::-webkit-slider-runnable-track {
            height: 4px;
            background: #444;
            border-radius: 2px;
        }

        #volume::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--text-secondary);
            cursor: pointer;
            margin-top: -9px;
        }

        #volume::-moz-range-track {
            height: 4px;
            background: #444;
            border-radius: 2px;
        }

        #volume::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--text-secondary);
            border: none;
        }

        @media (min-width: 600px) {
            .container {
                border-radius: 20px;
                min-height: 700px;
                padding: 20px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            }

            .beat-indicator {
                width: 150px;
                height: 150px;
                font-size: 4rem;
            }

            .controls {
                gap: 15px;
                padding: 20px;
            }

            #bpm-val {
                font-size: 3.5rem;
            }

            .primary-btn {
                padding: 15px;
                font-size: 1.2rem;
            }
        }

        @media (max-height: 600px) {
            .visualizer-container {
                flex-grow: 0;
                margin-bottom: 6px;
                padding: 4px 0;
            }

            .beat-indicator {
                width: 80px;
                height: 80px;
                font-size: 2rem;
            }

            .sub-beats {
                margin-top: 6px;
            }
        }

        /* Mode switch (Click / Drums) */
        .mode-switch {
            display: flex;
            gap: 4px;
            background-color: #333;
            border-radius: 12px;
            padding: 4px;
        }

        .mode-btn {
            flex: 1;
            background: none;
            border: none;
            border-radius: 9px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            padding: 10px 4px;
            min-height: 44px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .mode-btn.active {
            background-color: var(--primary-color);
            color: #000;
        }

        /* Elements list the modes they appear in: data-modes="drums strum" */
        body[data-mode="click"] [data-modes]:not([data-modes~="click"]),
        body[data-mode="drums"] [data-modes]:not([data-modes~="drums"]),
        body[data-mode="strum"] [data-modes]:not([data-modes~="strum"]) {
            display: none !important;
        }

        .setting-item.wide {
            grid-column: 1 / -1;
        }

        .swing-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #333;
            border-radius: 10px;
            padding: 0 14px;
            min-height: 44px;
        }

        .swing-control.disabled {
            opacity: 0.4;
        }

        #swing-val {
            font-size: 0.85rem;
            font-weight: bold;
            min-width: 36px;
            text-align: right;
        }

        #swing {
            flex-grow: 1;
            height: 4px;
            background: #555;
            border-radius: 2px;
        }

        #swing::-webkit-slider-runnable-track {
            height: 4px;
            background: #555;
            border-radius: 2px;
        }

        #swing::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            margin-top: -9px;
        }

        #swing::-moz-range-track {
            height: 4px;
            background: #555;
            border-radius: 2px;
        }

        #swing::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--primary-color);
            border: none;
        }

        /* Drum step sequencer */
        .drum-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 14px;
        }

        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 28px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        .fill-badge {
            margin-left: 6px;
            padding: 2px 6px;
            border-radius: 6px;
            background-color: var(--accent-color);
            color: #fff;
            font-size: 0.65rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.1s;
        }

        .fill-badge.on {
            opacity: 1;
        }

        .text-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 6px 4px;
            cursor: pointer;
        }

        .drum-grid {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .grid-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .row-label {
            width: 40px;
            flex-shrink: 0;
            background: none;
            border: none;
            color: var(--c);
            font-size: 0.62rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-align: right;
            padding: 0;
            min-height: 24px;
            cursor: pointer;
        }

        .grid-row.muted .row-label {
            opacity: 0.35;
            text-decoration: line-through;
        }

        .row-steps {
            flex: 1;
            display: flex;
            gap: 5px;
            min-width: 0;
        }

        .beat-group {
            flex: 1;
            display: flex;
            gap: 2px;
            min-width: 0;
        }

        .step {
            flex: 1;
            min-width: 0;
            height: 24px;
            padding: 0;
            border: none;
            border-radius: 4px;
            background-color: #2a2a2a;
            cursor: pointer;
            transition: background-color 0.08s, transform 0.08s, box-shadow 0.08s;
        }

        .beat-group .step:first-child {
            background-color: #363636;
        }

        /* Empty cells under the playhead light up; filled cells keep their color */
        .step.playhead,
        .beat-group .step.playhead:first-child {
            background-color: #555;
        }

        .step.v-ghost,
        .step.v-on,
        .step.v-accent,
        .beat-group .step.v-ghost:first-child,
        .beat-group .step.v-on:first-child,
        .beat-group .step.v-accent:first-child {
            background-color: var(--c);
        }

        .step.v-ghost { opacity: 0.3; }
        .step.v-on { opacity: 0.65; }
        .step.v-accent { opacity: 1; }

        .grid-row.muted .step.v-ghost,
        .grid-row.muted .step.v-on,
        .grid-row.muted .step.v-accent {
            opacity: 0.15;
        }

        .step.hit {
            opacity: 1;
            transform: scaleY(1.2);
            box-shadow: 0 0 10px var(--c);
        }

        .grid-help {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Strum editor */
        .strum-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 14px;
        }

        .strum-slots {
            display: grid;
            gap: 6px;
        }

        .strum-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            height: 56px;
            min-width: 0;
            padding: 0;
            border: none;
            border-radius: 10px;
            background-color: #2a2a2a;
            color: #555;
            cursor: pointer;
            transition: background-color 0.08s, color 0.08s, transform 0.08s;
        }

        .strum-slot .arrow {
            font-size: 1.5rem;
            font-weight: bold;
            line-height: 1;
        }

        .strum-slot .count {
            font-size: 0.65rem;
            color: var(--text-secondary);
        }

        .strum-slot.beat-start .count {
            color: var(--text-primary);
            font-weight: bold;
        }

        .strum-slot.s-D { --s: var(--primary-color); }
        .strum-slot.s-U { --s: var(--secondary-color); }
        .strum-slot.s-X { --s: var(--accent-color); }

        .strum-slot.s-D,
        .strum-slot.s-U,
        .strum-slot.s-X {
            background-color: #333;
            color: var(--s);
        }

        .strum-slot.playhead {
            background-color: #555;
        }

        .strum-slot.hit {
            background-color: var(--s);
            color: #000;
            transform: scale(1.08);
        }

        .strum-slot.hit .count {
            color: #000;
        }

        .drum-grid.readonly .step {
            cursor: default;
        }

        .preset-row {
            display: flex;
            gap: 8px;
        }

        .preset-row select,
        .preset-row input {
            flex: 1;
            min-width: 0;
        }

        input[type="text"] {
            padding: 10px 12px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            min-height: 44px;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }

        .small-btn {
            min-height: 44px;
            min-width: 44px;
            padding: 0 16px;
            border: none;
            border-radius: 10px;
            background-color: var(--primary-color);
            color: #000;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .small-btn.ghost {
            background-color: #333;
            color: var(--text-secondary);
        }

        body.drum-mode .beat-indicator {
            width: 96px;
            height: 96px;
            font-size: 2.4rem;
        }

        @media (max-height: 600px) {
            body.drum-mode .beat-indicator {
                width: 64px;
                height: 64px;
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body data-mode="click">
    <div class="container">
        <header>
            <h1>Piki Metronome</h1>
            <button id="wakeLockBtn" class="icon-btn" title="Toggle Screen Stay Awake">
                <span id="wakeLockStatus">🔓</span>
            </button>

    <script>
        // ---- Drum kit definition ----
        // level: mix level of the voice, color: step sequencer color
        const DRUM_VOICES = {
            crash:   { label: 'CRASH', color: '#ff8fab', level: 0.45 },
            ride:    { label: 'RIDE',  color: '#9ad0ff', level: 0.35 },

            hihat:   { label: 'HAT',   color: '#ffd166', level: 0.4 },
            shaker:  { label: 'SHAKE', color: '#f4a261', level: 0.3 },
            tef:     { label: 'TEF',   color: '#e9c46a', level: 0.35 },
            rim:     { label: 'RIM',   color: '#7ee787', level: 0.55 },
            clap:    { label: 'CLAP',  color: '#ff6b9d', level: 0.5 },
            snare:   { label: 'SNARE', color: '#03dac6', level: 0.8 },
            tek:     { label: 'TEK',   color: '#4dd0e1', level: 0.6 },
            dum:     { label: 'DÜM',   color: '#9575cd', level: 0.9 },
            tomH:    { label: 'TOM H', color: '#cf6679', level: 0.75 },
            tomM:    { label: 'TOM M', color: '#cf6679', level: 0.75 },
            tomL:    { label: 'TOM L', color: '#cf6679', level: 0.8 },
            kick:    { label: 'KICK',  color: '#bb86fc', level: 1.0 }

        // Rows always shown in the sequencer, even if the style doesn't use them
        const BASE_ROWS = ['hihat', 'snare', 'kick'];

        // Step notation: 'X' accent, 'x' normal, 'g' ghost, '.' rest
        const VELOCITY = { X: 1.0, x: 0.72, g: 0.32 };
        const STEP_CLASS = { X: 'v-accent', x: 'v-on', g: 'v-ghost' };
        const NEXT_STEP = { '.': 'x', x: 'X', X: '.', g: '.' };

        // Fills roll down the kit: snare -> high tom -> mid tom -> floor tom
        const FILL_VOICES = ['snare', 'tomH', 'tomM', 'tomL'];

        // Darbuka styles roll on the darbuka instead of the toms
        const DARBUKA_FILL = ['tek', 'tek', 'tek', 'dum'];

        // spb = steps per beat (2 = eighths, 3 = triplets, 4 = sixteenths)
        // swing = default swing amount (0..1) applied to off-steps
        // groups = optional uneven beat lengths in steps, for aksak meters (e.g. 9/8 = 2+2+2+3)
        // fill = optional voices for the fill roll (defaults to FILL_VOICES)
        const DRUM_STYLES = [
            { id: 'rock', name: 'Rock', meter: '4/4', beats: 4, spb: 2, swing: 0, voices: {

                snare: '..X...X.',

            { id: 'funk', name: 'Funk', meter: '4/4', beats: 4, spb: 4, swing: 0, voices: {

                snare: '....X..g.g..X..g',

            }},
            { id: 'disco', name: 'Disco / House', meter: '4/4', beats: 4, spb: 4, swing: 0, voices: {

                hihat:   'x...x...x...x...',
                clap:    '....x.......x...',
                snare:   '....X.......X...',
                kick:    'X...X...X...X...'
            }},
            { id: 'hiphop', name: 'Hip-Hop (Boom Bap)', meter: '4/4', beats: 4, spb: 4, swing: 0.4, voices: {
                hihat: 'x.x.X.x.x.x.X.x.',
                snare: '....X.......X...',
                kick:  'X......x..X..x..'
            }},
            { id: 'trap', name: 'Trap', meter: '4/4', beats: 4, spb: 4, swing: 0, voices: {

                clap:  '........X.......',

            }},

            }},
            { id: 'shuffle', name: 'Blues Shuffle', meter: '12/8', beats: 4, spb: 3, swing: 0, voices: {
                hihat: 'X.xX.xX.xX.x',
                snare: '...X.....X..',
                kick:  'X.....X....x'
            }},
            { id: 'waltz', name: 'Waltz', meter: '3/4', beats: 3, spb: 2, swing: 0, voices: {

            }},
            { id: 'ballad68', name: 'Ballad', meter: '6/8', beats: 2, spb: 3, swing: 0, voices: {
